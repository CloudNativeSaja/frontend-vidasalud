<main class="container">

  <h1>VidaSalud</h1>

  <p>Plataforma de gestión de atenciones</p>

  @if (!isLoggedIn) {

    <section>
      <h2>Bienvenido</h2>

      <p>
        Inicia sesión con Microsoft para continuar.
      </p>

      <button (click)="login()">
        Iniciar sesión con Microsoft
      </button>
    </section>

  } @else {

    <section>
      <h2>Sesión iniciada</h2>

      <p>
        Bienvenido, <strong>{{ userName }}</strong>
      </p>

      <button (click)="logout()">
        Cerrar sesión
      </button>
    </section>

  }

</main>
