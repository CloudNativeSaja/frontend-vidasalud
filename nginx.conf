server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: se pueden cachear por mucho tiempo
    location ~* \.(?:js|css|woff2?|ico|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de Angular (/citas, /catalogo...) devuelve index.html.
    # Necesario para que la redireccion de MSAL y las recargas no den 404.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
